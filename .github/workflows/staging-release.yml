name: Staging release controls

on:
  workflow_dispatch:
    inputs:
      migration_mode:
        description: 'Миграции: только preflight, применение или повторная проверка всей цепочки'
        required: true
        default: none
        type: choice
        options:
          - none
          - apply
          - reapply
      migration_acknowledgement:
        description: 'Для миграций: APPLY_STAGING_MIGRATIONS:<project-ref>'
        required: false
        default: ''
        type: string
      evidence_mode:
        description: 'Проверить безопасный пример или полный STAGING_EVIDENCE_BASE64'
        required: true
        default: draft
        type: choice
        options:
          - draft
          - complete

permissions:
  contents: read

concurrency:
  group: smoking-zen-staging-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    steps:
      - name: Checkout exact release input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify immutable checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Validate non-mutating promotion mode
        env:
          STAGING_MIGRATION_INPUT: ${{ inputs.migration_mode }}
          STAGING_EVIDENCE_INPUT: ${{ inputs.evidence_mode }}
        run: |
          set -Eeuo pipefail
          if [[ "$STAGING_EVIDENCE_INPUT" == complete ]]; then
            test "$STAGING_MIGRATION_INPUT" = none
          fi
      - name: Fail-closed staging contour preflight
        env:
          APP_MODE: production
          DEPLOYMENT_ENVIRONMENT: staging
          STAGING_ACTUAL_GITHUB_REPOSITORY: ${{ github.repository }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          STAGING_EXPECTED_APP_ORIGIN: ${{ vars.STAGING_EXPECTED_APP_ORIGIN }}
          STAGING_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.STAGING_EXPECTED_SUPABASE_PROJECT_REF }}
          STAGING_EXPECTED_TELEGRAM_BOT_USERNAME: ${{ vars.STAGING_EXPECTED_TELEGRAM_BOT_USERNAME }}
          STAGING_EXPECTED_TELEGRAM_MINI_APP_SHORT_NAME: ${{ vars.STAGING_EXPECTED_TELEGRAM_MINI_APP_SHORT_NAME }}
          STAGING_EXPECTED_SUPABASE_JWT_KID: ${{ vars.STAGING_EXPECTED_SUPABASE_JWT_KID }}
          STAGING_VAULT_APP_ORIGIN: ${{ secrets.STAGING_VAULT_APP_ORIGIN }}
          STAGING_VAULT_INTERNAL_JOB_SECRET: ${{ secrets.STAGING_VAULT_INTERNAL_JOB_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_ES256_PRIVATE_KEY: ${{ secrets.SUPABASE_JWT_ES256_PRIVATE_KEY }}
          SUPABASE_JWT_KID: ${{ vars.SUPABASE_JWT_KID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_MINI_APP_SHORT_NAME: ${{ vars.TELEGRAM_MINI_APP_SHORT_NAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER_TELEGRAM_ID: ${{ vars.OWNER_TELEGRAM_ID }}
          WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
          TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${{ vars.TELEGRAM_INIT_DATA_MAX_AGE_SECONDS }}
          SUPABASE_SELF_HOSTED_ORIGINS: ${{ vars.SUPABASE_SELF_HOSTED_ORIGINS }}
          BITWARDEN_SELF_HOSTED_ORIGINS: ${{ vars.BITWARDEN_SELF_HOSTED_ORIGINS }}
          BACKUP_PGHOST: ${{ vars.BACKUP_PGHOST }}
          BACKUP_PGPORT: ${{ vars.BACKUP_PGPORT }}
          BACKUP_PGDATABASE: ${{ vars.BACKUP_PGDATABASE }}
          BACKUP_PGUSER: ${{ vars.BACKUP_PGUSER }}
          BACKUP_PGSSLMODE: verify-full
          BACKUP_SOURCE_ENDPOINT: ${{ vars.BACKUP_SOURCE_ENDPOINT }}
          BACKUP_SOURCE_PROJECT_REF: ${{ vars.BACKUP_SOURCE_PROJECT_REF }}
          BACKUP_SOURCE_BUCKET: workspace-files
          BACKUP_TARGET_ENDPOINT: ${{ vars.BACKUP_TARGET_ENDPOINT }}
          BACKUP_TARGET_BUCKET: ${{ vars.BACKUP_TARGET_BUCKET }}
          BACKUP_TARGET_PREFIX: ${{ vars.BACKUP_TARGET_PREFIX }}
        run: node scripts/staging-preflight.mjs
      - name: Install source-matching PostgreSQL client
        if: inputs.migration_mode != 'none'
        uses: ./.github/actions/setup-backup-tools
        with:
          postgres-major: ${{ vars.BACKUP_POSTGRES_MAJOR }}
      - name: Prepare private project CA
        if: inputs.migration_mode != 'none'
        env:
          STAGING_PGSSLROOTCERT_BASE64: ${{ secrets.STAGING_PGSSLROOTCERT_BASE64 }}
        run: |
          set -Eeuo pipefail
          certificate_dir=$(mktemp -d "$RUNNER_TEMP/smoking-zen-staging-ca.XXXXXXXX")
          chmod 700 "$certificate_dir"
          certificate_file="$certificate_dir/root.crt"
          printf '%s' "$STAGING_PGSSLROOTCERT_BASE64" | base64 --decode > "$certificate_file"
          chmod 600 "$certificate_file"
          grep -q '^-----BEGIN CERTIFICATE-----$' "$certificate_file"
          grep -q '^-----END CERTIFICATE-----$' "$certificate_file"
          printf 'PGSSLROOTCERT=%s\n' "$certificate_file" >> "$GITHUB_ENV"
          printf 'STAGING_CA_DIRECTORY=%s\n' "$certificate_dir" >> "$GITHUB_ENV"
      - name: Apply or reapply exact staging migration chain
        if: inputs.migration_mode != 'none'
        env:
          APP_MODE: production
          DEPLOYMENT_ENVIRONMENT: staging
          STAGING_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.STAGING_EXPECTED_SUPABASE_PROJECT_REF }}
          STAGING_MIGRATION_ACKNOWLEDGEMENT: ${{ inputs.migration_acknowledgement }}
          STAGING_RELEASE_COMMIT: ${{ github.sha }}
          STAGING_MIGRATION_MODE: ${{ inputs.migration_mode }}
          PGHOST: ${{ vars.STAGING_PGHOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: ${{ vars.STAGING_PGUSER }}
          PGPASSWORD: ${{ secrets.STAGING_PGPASSWORD }}
          PGSSLMODE: verify-full
        run: scripts/apply-staging-migrations.sh
      - name: Remove private project CA
        if: always() && inputs.migration_mode != 'none'
        run: |
          set -Eeuo pipefail
          directory=${STAGING_CA_DIRECTORY:-}
          if [[ -n "$directory" ]]; then
            case "$directory" in
              "$RUNNER_TEMP"/smoking-zen-staging-ca.*) rm -r -- "$directory" ;;
              *) exit 1 ;;
            esac
          fi
      - name: Validate redacted staging evidence
        env:
          STAGING_EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          STAGING_RELEASE_COMMIT: ${{ github.sha }}
          STAGING_EVIDENCE_BASE64: ${{ secrets.STAGING_EVIDENCE_BASE64 }}
        run: |
          set -Eeuo pipefail
          evidence_input="$RUNNER_TEMP/staging-evidence-input.json"
          evidence_artifact="$RUNNER_TEMP/staging-evidence.json"
          trap 'rm -f -- "$evidence_input"' EXIT
          if [[ "$STAGING_EVIDENCE_MODE" == complete ]]; then
            test -n "$STAGING_EVIDENCE_BASE64"
            printf '%s' "$STAGING_EVIDENCE_BASE64" | base64 --decode > "$evidence_input"
            chmod 600 "$evidence_input"
            node scripts/validate-staging-evidence.mjs --require-complete \
              --output "$evidence_artifact" "$evidence_input"
          else
            test "$STAGING_EVIDENCE_MODE" = draft
            node scripts/validate-staging-evidence.mjs \
              --output "$evidence_artifact" docs/staging-evidence.example.json
          fi
      - name: Retain redacted evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-evidence-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-evidence.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  promote:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.evidence_mode == 'complete'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-promotion
    steps:
      - name: Checkout exact release input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Download reviewer-visible candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-evidence-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-evidence-candidate
      - name: Revalidate exact candidate after independent approval
        env:
          STAGING_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          candidate_dir="$RUNNER_TEMP/staging-evidence-candidate"
          evidence_artifact="$candidate_dir/staging-evidence.json"
          test -f "$evidence_artifact"
          test ! -L "$evidence_artifact"
          test "$(find "$candidate_dir" -type f -print | wc -l)" -eq 1
          chmod 600 "$evidence_artifact"
          node scripts/validate-staging-evidence.mjs --require-complete "$evidence_artifact"
      - name: Create redacted promotion receipt
        env:
          EVIDENCE_ARTIFACT: ${{ runner.temp }}/staging-evidence-candidate/staging-evidence.json
          PROMOTION_RECEIPT: ${{ runner.temp }}/staging-promotion-receipt.json
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const digest = createHash('sha256').update(readFileSync(process.env.EVIDENCE_ARTIFACT)).digest('hex');
          const receipt = {
            schemaVersion: 1,
            environment: 'staging-promotion',
            githubRepository: process.env.GITHUB_REPOSITORY,
            releaseCommit: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            evidenceSha256: `sha256:${digest}`,
            recordedAt: new Date().toISOString(),
            authority: 'github-environment-audit',
          };
          writeFileSync(process.env.PROMOTION_RECEIPT, `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE
          printf '%s\n' STAGING_PROMOTION_APPROVED
      - name: Retain approved evidence and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-evidence-candidate/staging-evidence.json
            ${{ runner.temp }}/staging-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
